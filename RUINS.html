<style>
:root {
  --moss-green: rgba(102, 140, 60, 0.75);
  --time-hue: 0deg;
  --ui-brightness: 1;
  --ui-saturation: 1;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
}

html, body {
  height: 100%;
  overflow-x: hidden;
  color: white;
}

/* BACKGROUND */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;

  filter:
    hue-rotate(var(--time-hue))
    brightness(var(--ui-brightness))
    saturate(var(--ui-saturation));

  transition: filter 4s linear;

  background-image:
    linear-gradient(
      to bottom,
      rgba(14, 28, 98, 0.35) 0%,
      rgba(36, 55, 150, 0.55) 40%,
      var(--moss-green) 100%
    ),
    url("https://image2url.com/r2/default/images/1771611268262-cf527bad-8bbd-40ca-8d2b-e2bc534bb656.png");

  background-size: 100% 100%, cover;
  background-repeat: no-repeat, repeat-y;
  background-position: top center, 0 0;

  animation: scrollBG 90s linear infinite;
}

@keyframes scrollBG {
  from { background-position: top center, 0 0; }
  to { background-position: top center, 0 2000px; }
}

.container {

  margin: 20px auto;
  padding: 20px;

.scroll-container {

.scroll-content {

.button {

.button:hover {

.embed {

  transition: 0.3s;

.control-buttons button:hover,

  color: black;

<script>
let useIframe = false;
let systemMode = false;

function changeEmbed(url) {
  const container = document.getElementById('viewerContainer');
  container.innerHTML = '';
  const element = document.createElement(useIframe ? 'iframe' : 'embed');
  element.src = url;
  element.className = 'embed';
  element.allowFullscreen = true;
  container.appendChild(element);
}

function toggleFullscreen() {
  const viewer = document.getElementById('viewerContainer').firstChild;
  if (viewer && viewer.requestFullscreen) viewer.requestFullscreen();
}

function toggleMode() {
  useIframe = !useIframe;
  document.getElementById('toggleModeButton').textContent =
    useIframe ? 'Use embed' : 'Use iframe';
}

/* Clock */
function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString();
}
updateClock();
setInterval(updateClock, 1000);

/* Panic Key */
document.addEventListener("keydown", function(e){
  if(e.key === "\\"){
    window.location.href = "https://olympia.schoology.com/home#/?_k=avjg3m";
  }
});

/* System Mode */
document.addEventListener("keydown", function(e){
  if(e.key === "="){
    systemMode = !systemMode;

    const scroll = document.querySelector(".scroll-container");
    const controls = document.querySelector(".control-buttons");
    const container = document.querySelector(".container");
    const embed = document.querySelector(".embed");

    if(systemMode){
      if(scroll) scroll.style.display="none";
      if(controls) controls.style.display="none";
      container.style.margin="0";
      container.style.width="100%";
      container.style.padding="5px";
      if(embed) embed.style.height="95vh";
    } else {
      if(scroll) scroll.style.display="";
      if(controls) controls.style.display="flex";
      container.style.margin="20px auto";
      container.style.width="95%";
      container.style.padding="20px";
      if(embed) embed.style.height="80vh";
    }
  }
});

/* Leave Warning */
window.addEventListener("beforeunload", function (e) {
  e.preventDefault();
  e.returnValue = "";
});

/* Time Hue */
function updateTimeHue(){
  const now=new Date();
  const minutes=now.getHours()*60+now.getMinutes();
  const hue=(minutes/1440)*60;
  document.body.style.setProperty("--time-hue",hue+"deg");
}
updateTimeHue();
setInterval(updateTimeHue,60000);

/* Boot Animation */
window.addEventListener("load",function(){
const orb=document.getElementById("bootOrb");
const screen=document.getElementById("bootScreen");

setTimeout(()=>{orb.style.transition="all 1.2s ease";
orb.style.opacity="1";
orb.style.transform="scale(6)";},200);

setTimeout(()=>{orb.style.transition="all 1.5s ease";
orb.style.transform="scale(20)";
orb.style.boxShadow="0 0 150px #00ff88";},1700);

setTimeout(()=>{screen.style.opacity="0";
screen.style.transition="opacity 1.2s ease";},3200);

setTimeout(()=>{screen.style.display="none";},4500);
});
</script>
